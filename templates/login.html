{% extends "base.html" %}
{% block title %}Login - PsygaBio Production System{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 60px auto;">
    <h1 style="text-align:center;">Sign In</h1>
    <p style="text-align:center; color: var(--muted); margin-top:-10px;">
        PsygaBio Production System
    </p>
    <form method="POST" style="margin-top: 20px;">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div style="margin-bottom: 14px;">
            <label for="username" style="display:block; font-weight:bold; margin-bottom:4px;">Username</label>
            <input type="text" name="username" id="username" required autofocus
                   style="width:100%; padding:10px; border:1px solid var(--border); border-radius:4px; font-size:15px;">
        </div>
        <div style="margin-bottom: 18px;">
            <label for="password" style="display:block; font-weight:bold; margin-bottom:4px;">Password</label>
            <input type="password" name="password" id="password" required
                   style="width:100%; padding:10px; border:1px solid var(--border); border-radius:4px; font-size:15px;">
        </div>
        <button type="submit" style="width:100%;">Sign In</button>
    </form>
</div>
{% endblock %}
