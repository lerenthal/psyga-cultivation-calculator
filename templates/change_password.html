{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width: 460px;">
    <h1>Change Password</h1>
    <p style="color: var(--muted);">
        You are signed in as <b>{{ current_user.username }}</b>
        (role: {{ current_user.role }}).
    </p>
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
        <div style="margin-bottom: 12px;">
            <label for="current_password" style="display:block; font-weight:bold; margin-bottom:4px;">Current Password</label>
            <input type="password" name="current_password" id="current_password" required
                   style="width:100%; padding:10px; border:1px solid var(--border); border-radius:4px; font-size:15px;">
        </div>
        <div style="margin-bottom: 12px;">
            <label for="new_password" style="display:block; font-weight:bold; margin-bottom:4px;">New Password (min 6 chars)</label>
            <input type="password" name="new_password" id="new_password" required minlength="6"
                   style="width:100%; padding:10px; border:1px solid var(--border); border-radius:4px; font-size:15px;">
        </div>
        <div style="margin-bottom: 18px;">
            <label for="confirm_password" style="display:block; font-weight:bold; margin-bottom:4px;">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_password" required minlength="6"
                   style="width:100%; padding:10px; border:1px solid var(--border); border-radius:4px; font-size:15px;">
        </div>
        <button type="submit" style="width:100%;">Update Password</button>
    </form>
</div>
{% endblock %}
