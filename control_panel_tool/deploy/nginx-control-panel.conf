# Server Control Panel behind nginx (recommended for a remote server)
#
#   sudo cp deploy/nginx-control-panel.conf /etc/nginx/sites-available/server-control-panel
#   sudo ln -s /etc/nginx/sites-available/server-control-panel /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then put the panel behind TLS with certbot:
#   sudo certbot --nginx -d panel.your-domain.tld

server {
    listen 80;
    server_name panel.your-domain.tld;

    # The panel is an internal tool - do not let it be indexed.
    add_header X-Robots-Tag "noindex, nofollow";

    # If you use the panel to restart apps, the requests are small, but
    # the log fetches can be a little larger.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
